<div class="flex-1 flex flex-col">
    <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-semibold text-gray-900">{{.Subject}}</h2>
            <div class="mt-1 text-sm text-gray-500">
                From
                <span class="font-medium text-gray-700">&lt;{{.Sender}}&gt;</span>
                •
                <time datetime="{{.ReceivedAt.Format "2006-01-02T15:04"}}">{{.ReceivedAt.Format "Mon, 02 Jan 2006 15:04:05 -0700"}}</time>
            </div>
        </div>
    </header>
    <!-- EmailBody -->
    <main class="flex-1 overflow-y-auto p-6 bg-white">
        {{.Body | safeHTML}}
    </main>
</div>
